<!DOCTYPE html>
<html lang="fr">
<head>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auberge Espagnole 🍽️</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --cream:      #FAF6EF;
    --sand:       #EDE5D8;
    --terracotta: #C2614A;
    --rust:       #9C3D27;
    --charcoal:   #2B2520;
    --muted:      #7A6E66;
    --white:      #FFFFFF;
    --tag-bg:     #FFF8F0;
    --ai-bg:      #1E1A17;
    --ai-accent:  #C2614A;
  }

  body { font-family: 'Inter', sans-serif; background: var(--cream); color: var(--charcoal); min-height: 100vh; }

  /* ── HEADER ── */
  header {
    background: var(--charcoal); padding: 48px 32px 40px; text-align: center;
    position: relative; overflow: hidden;
  }
  header::before {
    content: ''; position: absolute; inset: 0;
    background: repeating-linear-gradient(45deg,transparent,transparent 28px,rgba(194,97,74,.07) 28px,rgba(194,97,74,.07) 29px);
  }
  header .eyebrow { font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--terracotta); margin-bottom: 12px; position: relative; }
  header h1 { font-family: 'Playfair Display', serif; font-size: clamp(2.2rem,6vw,3.8rem); font-weight: 900; color: var(--white); line-height: 1.05; position: relative; }
  header h1 span { color: var(--terracotta); }
  header p.subtitle { margin-top: 14px; color: #B0A89F; font-size: 1rem; position: relative; }

  /* ── LAYOUT ── */
  main { max-width: 1040px; margin: 0 auto; padding: 40px 20px 100px; display: grid; grid-template-columns: 1fr 1.55fr; gap: 36px; align-items: start; }
  @media (max-width: 720px) { main { grid-template-columns: 1fr; } }

  /* ── PANEL ── */
  .panel { background: var(--white); border: 1.5px solid var(--sand); border-radius: 16px; padding: 28px 24px; position: sticky; top: 24px; }
  .panel h2 { font-family: 'Playfair Display', serif; font-size: 1.35rem; font-weight: 700; color: var(--charcoal); margin-bottom: 22px; display: flex; align-items: center; gap: 8px; }

  label { display: block; font-size: .78rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  input, select, textarea { width: 100%; padding: 10px 13px; border: 1.5px solid var(--sand); border-radius: 8px; font-family: 'Inter', sans-serif; font-size: .95rem; background: var(--cream); color: var(--charcoal); outline: none; transition: border-color .18s; margin-bottom: 16px; }
  input:focus, select:focus, textarea:focus { border-color: var(--terracotta); background: var(--white); }
  textarea { resize: vertical; min-height: 72px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 12px 22px; border: none; border-radius: 10px; font-family: 'Inter', sans-serif; font-size: .92rem; font-weight: 600; cursor: pointer; transition: transform .12s, box-shadow .12s; width: 100%; }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: var(--terracotta); color: var(--white); box-shadow: 0 4px 18px rgba(194,97,74,.28); }
  .btn-primary:hover { background: var(--rust); }
  .btn-danger { background: transparent; color: var(--terracotta); border: 1.5px solid var(--sand); margin-top: 8px; font-size: .82rem; padding: 8px; }
  .btn-danger:hover { border-color: var(--terracotta); }

  .success-msg { display: none; background: #EAF3E4; color: #3A6B2A; border-radius: 8px; padding: 10px 14px; font-size: .88rem; margin-top: 12px; text-align: center; }

  /* ── STATS ── */
  .stats { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
  .stat-chip { background: var(--white); border: 1.5px solid var(--sand); border-radius: 24px; padding: 6px 14px; font-size: .82rem; font-weight: 600; color: var(--muted); display: flex; align-items: center; gap: 5px; }
  .stat-chip b { color: var(--charcoal); }

  /* ── FILTERS ── */
  .filters { display: flex; gap: 8px; margin-bottom: 22px; flex-wrap: wrap; }
  .filter-btn { padding: 5px 13px; border-radius: 20px; border: 1.5px solid var(--sand); background: var(--white); font-size: .8rem; font-weight: 600; cursor: pointer; transition: all .15s; color: var(--muted); }
  .filter-btn.active, .filter-btn:hover { background: var(--terracotta); border-color: var(--terracotta); color: var(--white); }

  /* ── CARDS ── */
  .cards-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .cards-header h2 { font-family: 'Playfair Display', serif; font-size: 1.35rem; font-weight: 700; }
  #cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }

  .card { background: var(--tag-bg); border: 1.5px solid var(--sand); border-radius: 14px; padding: 18px 16px 14px; position: relative; animation: cardIn .25s ease both; transition: box-shadow .18s, transform .18s; }
  .card:hover { box-shadow: 0 6px 22px rgba(43,37,32,.10); transform: translateY(-2px); }
  @keyframes cardIn { from { opacity: 0; transform: translateY(12px) scale(.97); } to { opacity: 1; transform: none; } }

  .card .cat-tag { display: inline-block; font-size: .68rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: 2px 9px; border-radius: 12px; margin-bottom: 10px; }
  .card .item-name { font-family: 'Playfair Display', serif; font-size: 1.1rem; font-weight: 700; color: var(--charcoal); line-height: 1.25; margin-bottom: 6px; }
  .card .item-note { font-size: .82rem; color: var(--muted); line-height: 1.45; margin-bottom: 12px; min-height: 20px; }
  .card .card-footer { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--sand); padding-top: 10px; margin-top: 4px; }
  .card .contributor { font-size: .8rem; font-weight: 600; color: var(--charcoal); display: flex; align-items: center; gap: 6px; }
  .card .avatar { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: .7rem; font-weight: 700; color: var(--white); flex-shrink: 0; }
  .card .del-btn { background: none; border: none; cursor: pointer; color: #C8BFB8; font-size: .95rem; padding: 2px 4px; border-radius: 4px; transition: color .15s; }
  .card .del-btn:hover { color: var(--terracotta); }

  #empty-state { grid-column: 1 / -1; text-align: center; padding: 52px 20px; color: var(--muted); }
  #empty-state .big { font-size: 3rem; margin-bottom: 12px; }
  #empty-state p { font-size: .95rem; line-height: 1.6; }

  .cat-entree  { background: #FDE8DC; color: #9C3D27; }
  .cat-plat    { background: #DCE8E0; color: #2D6A4F; }
  .cat-dessert { background: #E8DCF5; color: #6B3FA0; }
  .cat-boisson { background: #DCE9F5; color: #1A5E8A; }
  .cat-autre   { background: #F0EAD6; color: #6B5F3D; }

  .section-divider { border: none; border-top: 1.5px solid var(--sand); margin: 18px 0; }
  .loading { text-align: center; color: var(--muted); padding: 24px; font-size: .9rem; }

  /* ══════════════════════════════════════
     AI CHAT BUBBLE & PANEL
  ══════════════════════════════════════ */
  #chat-fab {
    position: fixed; bottom: 28px; right: 28px; z-index: 1000;
    width: 60px; height: 60px; border-radius: 50%;
    background: var(--terracotta);
    box-shadow: 0 6px 28px rgba(194,97,74,.45);
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.55rem;
    transition: transform .18s, box-shadow .18s;
  }
  #chat-fab:hover { transform: scale(1.08); box-shadow: 0 8px 36px rgba(194,97,74,.55); }
  #chat-fab .fab-badge {
    position: absolute; top: -4px; right: -4px;
    background: #3A8A5C; color: #fff;
    font-size: .6rem; font-weight: 700;
    padding: 2px 6px; border-radius: 10px;
    letter-spacing: .04em;
  }

  #chat-panel {
    position: fixed; bottom: 100px; right: 28px; z-index: 999;
    width: 370px; max-width: calc(100vw - 40px);
    background: var(--ai-bg);
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
    display: flex; flex-direction: column;
    overflow: hidden;
    transform: translateY(20px) scale(.96);
    opacity: 0;
    pointer-events: none;
    transition: opacity .22s ease, transform .22s ease;
    max-height: 560px;
  }
  #chat-panel.open { opacity: 1; transform: none; pointer-events: all; }

  .chat-header {
    background: linear-gradient(135deg, #3A2E28 0%, #2B2520 100%);
    padding: 16px 18px 14px;
    display: flex; align-items: center; gap: 12px;
    border-bottom: 1px solid rgba(255,255,255,.07);
    flex-shrink: 0;
  }
  .chat-header .chef-avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--terracotta);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.25rem; flex-shrink: 0;
  }
  .chat-header .chef-info { flex: 1; }
  .chat-header .chef-name { font-size: .92rem; font-weight: 700; color: #F5EFE8; }
  .chat-header .chef-status { font-size: .72rem; color: #9B8F87; display: flex; align-items: center; gap: 4px; }
  .chat-header .chef-status::before { content: '●'; color: #3A8A5C; font-size: .6rem; }
  .chat-header .close-btn { background: none; border: none; color: #6B5F5A; cursor: pointer; font-size: 1.1rem; padding: 4px; border-radius: 6px; transition: color .15s; }
  .chat-header .close-btn:hover { color: #F5EFE8; }

  #chat-messages {
    flex: 1; overflow-y: auto; padding: 16px 14px;
    display: flex; flex-direction: column; gap: 12px;
    scroll-behavior: smooth;
  }
  #chat-messages::-webkit-scrollbar { width: 4px; }
  #chat-messages::-webkit-scrollbar-track { background: transparent; }
  #chat-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 4px; }

  .msg { display: flex; gap: 8px; align-items: flex-end; animation: msgIn .2s ease both; }
  @keyframes msgIn { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform:none; } }

  .msg.user { flex-direction: row-reverse; }
  .msg-bubble {
    max-width: 82%; padding: 10px 13px; border-radius: 14px;
    font-size: .85rem; line-height: 1.55; word-break: break-word;
  }
  .msg.ai .msg-bubble { background: #2E2621; color: #EDE5D8; border-bottom-left-radius: 4px; }
  .msg.user .msg-bubble { background: var(--terracotta); color: #fff; border-bottom-right-radius: 4px; }
  .msg-bubble strong { color: #F4A07A; }
  .msg-bubble ul { padding-left: 16px; margin-top: 4px; }
  .msg-bubble li { margin-bottom: 2px; }

  .msg-avatar { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: .85rem; flex-shrink: 0; }
  .msg.ai .msg-avatar { background: var(--terracotta); }
  .msg.user .msg-avatar { background: #4A3F38; color: #B0A89F; font-size: .7rem; font-weight: 700; }

  /* typing indicator */
  .typing-bubble { display: flex; gap: 4px; align-items: center; padding: 12px 14px; }
  .typing-bubble span { width: 7px; height: 7px; border-radius: 50%; background: #6B5F5A; animation: bounce 1.2s infinite; }
  .typing-bubble span:nth-child(2) { animation-delay: .2s; }
  .typing-bubble span:nth-child(3) { animation-delay: .4s; }
  @keyframes bounce { 0%,60%,100% { transform:translateY(0); } 30% { transform:translateY(-6px); background:#C2614A; } }

  /* suggestion chips */
  .suggestions { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 14px 10px; }
  .sug-chip {
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12);
    color: #C8BFB8; font-size: .75rem; padding: 5px 11px; border-radius: 16px;
    cursor: pointer; transition: all .15s; font-family: 'Inter', sans-serif;
  }
  .sug-chip:hover { background: var(--terracotta); color: #fff; border-color: var(--terracotta); }

  /* chat input */
  .chat-input-row {
    display: flex; gap: 8px; padding: 12px 14px;
    background: #1A1612;
    border-top: 1px solid rgba(255,255,255,.06);
    flex-shrink: 0;
  }
  #chat-input {
    flex: 1; background: #2E2621; border: 1.5px solid rgba(255,255,255,.1);
    border-radius: 10px; padding: 9px 13px; font-family: 'Inter', sans-serif;
    font-size: .88rem; color: #EDE5D8; outline: none; resize: none;
    max-height: 80px; line-height: 1.45;
    transition: border-color .18s;
  }
  #chat-input::placeholder { color: #5A524C; }
  #chat-input:focus { border-color: var(--terracotta); }
  #chat-send {
    width: 38px; height: 38px; border-radius: 10px; border: none;
    background: var(--terracotta); color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem; flex-shrink: 0; align-self: flex-end;
    transition: background .15s, transform .12s;
  }
  #chat-send:hover { background: var(--rust); }
  #chat-send:active { transform: scale(.93); }
  #chat-send:disabled { background: #3A2E28; color: #5A524C; cursor: not-allowed; }
</style>
</head>
<body>

<main>
  <!-- ── FORM ── -->
  <aside>
    <div class="panel">
      <h2>✏️ Je participe !</h2>
      <label for="inp-name">Votre prénom</label>
      <input id="inp-name" type="text" placeholder="ex. Sophie" maxlength="40">

      <button class="filter-btn" onclick="setFilter('dessert',this)">🍰 Desserts</button>

<!-- ══ AI CHAT FAB ══ -->
<button id="chat-fab" onclick="toggleChat()" title="Besoin d'aide pour choisir ?">
  🍳
  <span class="fab-badge">IA</span>
</button>

<!-- ══ AI CHAT PANEL ══ -->
<div id="chat-panel">
  <div class="chat-header">
    <div class="chef-avatar">👨‍🍳</div>
    <div class="chef-info">
      <div class="chef-name">Chef Gustave</div>
      <div class="chef-status">Assistant culinaire IA</div>

  <div id="chat-messages"></div>

	<div class="suggestions" id="suggestions">

	  <button class="sug-chip"
			  onclick="sendSuggestion(this.textContent)">
			  🤔 Je ne sais pas quoi apporter
	  </button>

			  onclick="sendSuggestion(this.textContent)">

	  </button>

	  <button class="sug-chip"
			  onclick="sendSuggestion(this.textContent)">
			  ⏱️ Recette en moins de 30 min
	  </button>

	  <button class="sug-chip"
			  onclick="sendSuggestion(this.textContent)">
			  🍰 Quel dessert choisir ?
	  </button>

	  <button class="sug-chip"
			  onclick="sendSuggestion(this.textContent)">
			  🍷 Quelle boisson apporter ?
	  </button>

	  <button class="sug-chip"
			  onclick="sendSuggestion(this.textContent)">
			  🥗 Que manque-t-il au repas ?

	</div>

  <div class="chat-input-row">

    <button id="chat-send" onclick="sendChat()">➤</button>

<script>
/* ════════════════════════════════════════
   APP STATE
════════════════════════════════════════ */
const STORAGE_KEY = 'auberge-items-v1';
let items = [];
let currentFilter = 'all';

const CAT_LABELS = { entree:'🥗 Entrée', plat:'🍲 Plat', dessert:'🍰 Dessert', boisson:'🍷 Boisson', autre:'🧺 Autre' };

/* ════════════════════════════════════════
   STORAGE
════════════════════════════════════════ */
async function saveItem(item) {

  await supabaseClient
    .from('contributions')
    .insert(item);

}

async function loadItems() {
  const grid = document.getElementById('cards-grid');

  // Affichage immédiat
  grid.innerHTML = `
    <div id="empty-state">
      <div class="big">⏳</div>
      <p>Chargement des contributions...</p>
    </div>
  `;

  try {
    const { data, error } = await supabaseClient
      .from('contributions')
      .select('*')
      .order('created_at', { ascending: true });

    if (error) throw error;

    items = data || [];
    render();

  } catch (error) {
    console.error('Erreur Supabase loadItems:', error);

    items = [];
    render();

    grid.innerHTML = `
      <div id="empty-state">
        <div class="big">⚠️</div>
        <p>
          Impossible de charger les contributions.<br>
          ${error.message || 'Vérifiez Supabase.'}
        </p>
      </div>
    `;
  }
}

/* ════════════════════════════════════════
   ADD / DELETE
════════════════════════════════════════ */
async function addItem() {
  const name = document.getElementById('inp-name').value.trim();
  const item = document.getElementById('inp-item').value.trim();
  const cat  = document.getElementById('inp-cat').value;
  const note = document.getElementById('inp-note').value.trim();

  if (!name) {
    flash(document.getElementById('inp-name'), "Merci d'entrer votre prénom");
    return;
  }

  if (!item) {
    flash(document.getElementById('inp-item'), "Que voulez-vous apporter ?");
    return;
  }

  const contribution = {
    id: String(Date.now()) + Math.random().toString(36).slice(2),
    name,
    item,
    cat,
    note,
    ts: Date.now()
  };

  try {
    const { error } = await supabaseClient
      .from('contributions')
      .insert([contribution]);

    if (error) throw error;

    document.getElementById('inp-item').value = '';
    document.getElementById('inp-note').value = '';

    const msg = document.getElementById('success-msg');
    msg.style.display = 'block';
    setTimeout(() => msg.style.display = 'none', 2400);

    await loadItems();

	} catch (error) {
	  console.error('Erreur Supabase complète:', error);
	  alert(
		"Erreur Supabase : " +
		(error.message || JSON.stringify(error))
	  );
	}
}

async function deleteItem(id) {
  try {
    const { error } = await supabaseClient
      .from('contributions')
      .delete()
      .eq('id', id);

    if (error) throw error;

    await loadItems();

  } catch (error) {
    console.error('Erreur Supabase deleteItem:', error);
    alert("Erreur : impossible de supprimer cette contribution.");
  }
}



async function clearAll() {
  if (!confirm('Effacer toutes les contributions ?')) return;

  try {
    const { error } = await supabaseClient
      .from('contributions')
      .delete()
      .neq('id', '');

    if (error) throw error;

    await loadItems();

  } catch (error) {
    console.error('Erreur Supabase clearAll:', error);
    alert("Erreur : impossible d'effacer les contributions.");
  }
}

/* ════════════════════════════════════════
   FILTER + RENDER
════════════════════════════════════════ */
function setFilter(cat, btn) {
  currentFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active'); render();
}
function render() { renderStats(); renderCards(); }

function renderStats() {
  const counts = { entree:0, plat:0, dessert:0, boisson:0, autre:0 };
  items.forEach(i => counts[i.cat]++);
  const participants = [...new Set(items.map(i => i.name.toLowerCase()))].length;
  document.getElementById('stats-bar').innerHTML = `
    <div class="stat-chip">👥 <b>${participants}</b> participant${participants>1?'s':''}</div>
    <div class="stat-chip">📦 <b>${items.length}</b> contribution${items.length>1?'s':''}</div>
    ${Object.entries(counts).filter(([,v])=>v>0).map(([k,v])=>`
      <div class="stat-chip"><span class="cat-tag cat-${k}" style="padding:1px 7px;margin:0;font-size:.68rem">${CAT_LABELS[k]}</span> <b>${v}</b></div>
    `).join('')}`;
}

function renderCards() {
  const grid = document.getElementById('cards-grid');
  const filtered = currentFilter === 'all' ? items : items.filter(i => i.cat === currentFilter);
  document.getElementById('list-title').textContent = currentFilter === 'all'
    ? `Ce qu'on apporte (${items.length})` : `${CAT_LABELS[currentFilter]} (${filtered.length})`;
  if (filtered.length === 0) {
    grid.innerHTML = `<div id="empty-state"><div class="big">🍽️</div><p>${items.length===0?'Aucune contribution pour l\'instant.<br>Soyez le premier à ajouter quelque chose !':'Aucune contribution dans cette catégorie.'}</p></div>`;
    return;
  }
  const catOrder = ['entree','plat','dessert','boisson','autre'];
  const sorted = [...filtered].sort((a,b) => catOrder.indexOf(a.cat) - catOrder.indexOf(b.cat));
  const colors = ['#C2614A','#3A8A5C','#7B52B8','#2471A3','#8A7A52','#B7500A','#1A6B5A'];
  grid.innerHTML = sorted.map(e => {
    const initials = e.name.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
    const color = colors[[...e.name].reduce((a,c)=>a+c.charCodeAt(0),0) % colors.length];
    return `<article class="card">
      <span class="cat-tag cat-${e.cat}">${CAT_LABELS[e.cat]}</span>
      <div class="item-name">${esc(e.item)}</div>
      ${e.note?`<div class="item-note">${esc(e.note)}</div>`:'<div class="item-note"></div>'}
      <div class="card-footer">
        <div class="contributor"><div class="avatar" style="background:${color}">${initials}</div>${esc(e.name)}</div>
        <button class="del-btn" onclick="deleteItem('${e.id}')">✕</button>
      </div></article>`;
  }).join('');
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function flash(el, msg) {
  el.style.borderColor = '#C2614A'; el.placeholder = msg; el.focus();
  setTimeout(() => { el.style.borderColor = ''; el.placeholder = el.id==='inp-name'?'ex. Sophie':'ex. Tarte aux citrons'; }, 2000);
}
function autoResize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 80) + 'px'; }

let chatHistory = [];
let chatOpen = false;
let isTyping = false;

function toggleChat() {
  chatOpen = !chatOpen;
  const panel = document.getElementById('chat-panel');
  panel.classList.toggle('open', chatOpen);
  if (chatOpen && chatHistory.length === 0) {
    // Welcome message

`Bonjour 👋

), 300);

function buildSystemPrompt() {

  const counts = {
    entree:0,
    plat:0,
    dessert:0,
    boisson:0,
    autre:0
  };

  items.forEach(i => counts[i.cat]++);

  const list = items.length === 0
    ? "Aucune contribution enregistrée pour l'instant."
    : items.map(i =>
      `- ${i.name} apporte : ${i.item} (${CAT_LABELS[i.cat]})${i.note ? ' — ' + i.note : ''}`
    ).join('\n');

  return `
Tu es Chef Gustave, un assistant IA expert en cuisine et en organisation d'auberge espagnole.

═══════════════════════
CONTRIBUTIONS ACTUELLES
═══════════════════════

${list}

Résumé :
${counts.entree} entrée(s)
${counts.plat} plat(s)
${counts.dessert} dessert(s)
${counts.boisson} boisson(s)
${counts.autre} autre(s)

═══════════════════════
MISSION
═══════════════════════

Tu aides les personnes indécises à choisir quoi apporter.

Tu peux conseiller :

- Entrées
- Plats
- Desserts
- Boissons
- Apéritifs
- Accompagnements

Tu tiens compte :

- des plats déjà enregistrés
- des doublons éventuels

- du temps disponible
- du niveau en cuisine
- des régimes alimentaires
- du nombre de participants

═══════════════════════

═══════════════════════

1. Si l'utilisateur hésite, pose jusqu'à 3 questions simples avant de proposer une recommandation.

2. Pour chaque suggestion indique :

• Pourquoi ce choix est pertinent

3. Si une catégorie manque dans le repas, privilégie cette catégorie.

6. Les recettes doivent être :

- conviviales
- transportables
- adaptées à une auberge espagnole
- réalistes pour 15 personnes

7. Réponds toujours en français.

8. Sois chaleureux, pratique et concis.

9. Maximum 180 mots.
`;
}

async function sendChat() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text || isTyping) return;

  input.value = ''; input.style.height = 'auto';
  document.getElementById('suggestions').style.display = 'none';

  addUserMessage(text);
  chatHistory.push({ role: 'user', content: text });

  showTyping();
  document.getElementById('chat-send').disabled = true;
  isTyping = true;

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: buildSystemPrompt(),
        messages: chatHistory
      })
    });
    const data = await response.json();
    const reply = data.content?.[0]?.text || "Désolé, je n'ai pas pu répondre. Réessayez !";

    removeTyping();
    addAiMessage(reply);
    chatHistory.push({ role: 'assistant', content: reply });
  } catch(e) {
    removeTyping();
    addAiMessage("Oups, une erreur est survenue. Vérifiez votre connexion et réessayez 🙏");
  }

  isTyping = false;
  document.getElementById('chat-send').disabled = false;
  document.getElementById('chat-input').focus();
}

function sendSuggestion(text) {
  document.getElementById('chat-input').value = text;
  sendChat();
}

function addUserMessage(text) {
  const msgs = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.className = 'msg user';
  div.innerHTML = `<div class="msg-avatar">Moi</div><div class="msg-bubble">${esc(text)}</div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function addAiMessage(text) {
  const msgs = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.className = 'msg ai';
  div.innerHTML = `<div class="msg-avatar">👨‍🍳</div><div class="msg-bubble">${renderMarkdown(text)}</div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function showTyping() {
  const msgs = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.className = 'msg ai'; div.id = 'typing-indicator';
  div.innerHTML = `<div class="msg-avatar">👨‍🍳</div><div class="msg-bubble typing-bubble"><span></span><span></span><span></span></div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typing-indicator');
  if (t) t.remove();
}

function renderMarkdown(text) {
  return text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/^[-•] (.+)$/gm,'<li>$1</li>')
    .replace(/(<li>.*<\/li>)/s,'<ul>$1</ul>')
    .replace(/\n/g,'<br>');
}

function getMealBalance() {

  const counts = {
    entree:0,
    plat:0,
    dessert:0,
    boisson:0
  };

  items.forEach(item => {
    if(counts[item.cat] !== undefined){
      counts[item.cat]++;
    }
  });

  const missing = [];

  if(counts.entree === 0) missing.push("🥗 Entrées");
  if(counts.plat === 0) missing.push("🍲 Plats");
  if(counts.dessert === 0) missing.push("🍰 Desserts");
  if(counts.boisson === 0) missing.push("🍷 Boissons");

  return {
    counts,
    missing
  };
}
